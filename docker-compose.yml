services:
  db:
    image: mysql:8.0
    container_name: longmao_db_507
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: longmao_db
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
      - db_data:/var/lib/mysql
    ports:
      - "3306:3306"
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin" ,"ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  backend:
    build: ./backend
    container_name: longmao_backend_507
    ports:
      - "18507:8507"
    depends_on:
      db:
        condition: service_healthy
    environment: {}

  frontend:
    build: ./frontend
    container_name: longmao_frontend_507
    ports:
      - "13507:80"
    depends_on:
      - backend

volumes:
  db_data:
